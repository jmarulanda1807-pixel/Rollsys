<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RollSys</title>
<style>
:root{--ink:#120d2b;--bg:#f2f0fb;--card:#fff;--mut:#6b6590}
@media(prefers-color-scheme:dark){:root{--ink:#f1eeff;--bg:#0d0a1f;--card:#171233;--mut:#a29bcc}}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;font:16px/1.5 system-ui,sans-serif;color:var(--ink);background:radial-gradient(50% 40% at 90% 0,#cdb4ff88,transparent 70%),radial-gradient(45% 40% at 0 100%,#ffb8e488,transparent 70%),var(--bg)}
main{max-width:420px;text-align:center}
.lg{width:260px;max-width:80%;background:#fff;padding:8px;border-radius:46% 54% 50% 50%/58% 44% 56% 42%;box-shadow:0 18px 36px -20px #5b2df0}
p{color:var(--mut)}
a{display:block;margin:12px 0;padding:14px 22px;border-radius:99px;color:#fff;font-weight:700;text-decoration:none;background:linear-gradient(100deg,#5b2df0,#c04df0 50%,#ff4fb4)}
</style></head><body><main>
<img class="lg" src="tienda/static/tienda/logo.png" alt="RollSys">
<p>Tu tienda de patines, en un solo sistema.</p>
<a href="facturador/">Abrir el facturador</a>
</main></body></html>
