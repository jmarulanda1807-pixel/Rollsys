<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>RollSys Factura</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700&display=swap"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT,WONK@1,9..144,800,100,1&display=swap">
<style>
:root{--ink:#120d2b;--bg:#f2f0fb;--card:#fff;--line:#e3def5;--mut:#6b6590;--v:#5b2df0;--o:#b45cf5;--pk:#ff4fb4;--b1:#cdb4ff;--b2:#ffb8e4;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--ink:#f1eeff;--bg:#0d0a1f;--card:#171233;--line:#2a2352;--mut:#a29bcc;--b1:#3a1f8f;--b2:#6b1a62}}
:root[data-theme=dark]{--ink:#f1eeff;--bg:#0d0a1f;--card:#171233;--line:#2a2352;--mut:#a29bcc;--b1:#3a1f8f;--b2:#6b1a62}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;color:var(--ink);font:400 15px/1.45 Figtree,system-ui,sans-serif;background:radial-gradient(50% 40% at 95% 0,var(--b1),transparent 70%),radial-gradient(45% 40% at 0 100%,var(--b2),transparent 70%),var(--bg);background-attachment:fixed;min-height:100vh}
.w{max-width:1000px;margin:0 auto;padding:20px clamp(14px,3vw,32px) 60px}
header{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.lg{width:150px;background:#fff;border-radius:46% 54% 50% 50%/58% 44% 56% 42%;padding:6px;box-shadow:0 14px 30px -18px #5b2df0}
h1,h2{font:italic 800 clamp(28px,5vw,46px)/1 Fraunces,Georgia,serif;font-variation-settings:"SOFT" 100,"WONK" 1;margin:0}h2{font-size:24px;margin-bottom:12px}
.sub{color:var(--mut);margin:4px 0 0}
nav{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 18px}
button,input,select,textarea{font:inherit;color:var(--ink)}
nav button{border:0;background:none;padding:10px 20px;border-radius:99px;font-weight:700;cursor:pointer}nav button.on{background:linear-gradient(100deg,var(--v),#c04df0 50%,var(--pk));color:#fff}
.c{background:var(--card);border-radius:38px 60px 42px 56px/50px 40px 58px 44px;padding:22px;margin-bottom:16px;box-shadow:0 18px 40px -28px #3b1fa8}
.g{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
label{font-size:13px;color:var(--mut);display:block}
input,select,textarea{width:100%;background:var(--bg);border:1.5px solid var(--line);border-radius:99px;padding:10px 16px}textarea{border-radius:20px}
.btn{border:0;cursor:pointer;font-weight:700;padding:10px 22px;border-radius:99px;color:#fff;background:linear-gradient(100deg,var(--v),#c04df0 50%,var(--pk))}.btn.g2{background:var(--line);color:var(--ink)}
table{width:100%;border-collapse:collapse}th{text-align:left;color:var(--mut);font-weight:600;font-size:13px}td,th{padding:9px 6px;border-top:1px solid var(--line)}.r{text-align:right}
.tot{display:flex;justify-content:flex-end;gap:24px;font-size:17px}.tot b{font-size:24px}
.sc{overflow-x:auto}
#doc{background:#fff;color:#120d2b;padding:28px;border-radius:24px}#doc td,#doc th{border-color:#e3def5}
.bar{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}
@media print{body{background:#fff}.np{display:none!important}.w{padding:0}#doc{box-shadow:none;padding:0}}
</style></head><body><div class="w"><header class="np"><img class="lg" src="tienda/static/tienda/logo.png" alt="RollSys"><div><h1>Facturador</h1><p class="sub">Registra cada venta una sola vez y entrega su comprobante.</p></div></header><nav class="np" id="nav"></nav><main id="m"></main></div>
<script>
const $=s=>document.querySelector(s),fm=n=>"$"+Math.round(n).toLocaleString("es-CO"),esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const D0=()=>({cfg:{tienda:"Mi tienda de patines",nit:"",dir:"",tel:"",pre:"RS",sig:1,iva:0,nota:"Comprobante de venta. No reemplaza la factura electrónica de la DIAN."},prods:[["Patín Vento Pro",389000],["Patín Cruiser",159000],["Rodamientos ABEC-9",38000],["Ruedas 80 mm x4",62000],["Casco Rider",79000],["Kit de protecciones",69000]],facts:[]});
let S;try{S=JSON.parse(localStorage.getItem("rsf"))||D0()}catch(e){S=D0()}
const save=()=>{try{localStorage.setItem("rsf",JSON.stringify(S))}catch(e){}};
let L=[],tab="nueva",view=null,csv="",LG=document.querySelector(".lg").src;
const TABS=[["nueva","Nueva factura"],["hist","Historial"],["prod","Productos"],["cfg","Ajustes"]];
function go(t){tab=t;view=null;csv="";draw()}
function addL(){const n=$("#pn").value.trim(),q=+$("#pq").value,p=+$("#pp").value;if(!n||q<1||p<0||isNaN(p))return alert("Escribe el producto, la cantidad y el precio.");L.push([n,q,p]);draw()}
function pick(){const f=S.prods.find(x=>x[0]==$("#pn").value);if(f)$("#pp").value=f[1]}
function emitir(){if(!L.length)return alert("Agrega al menos un producto.");const c=S.cfg,sub=L.reduce((a,x)=>a+x[1]*x[2],0),iva=sub*c.iva/100,num=c.pre+String(c.sig).padStart(5,"0");S.facts.unshift({num,f:new Date().toISOString(),cli:$("#cn").value||"Cliente general",doc:$("#cd").value,pago:$("#cp").value,it:L,sub,iva,total:sub+iva,cfg:{...c}});c.sig++;save();L=[];view=num;draw()}
function doc(f){const c=f.cfg;return `<div id="doc"><div class="bar np"><button class="btn" onclick="print()">Imprimir o guardar en PDF</button><button class="btn g2" onclick="view=null;draw()">Volver</button></div><div style="display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:center"><div><img src="${LG}" alt="" style="width:130px"><h2 style="margin:6px 0 2px">${esc(c.tienda)}</h2><div>${esc(c.nit)} ${esc(c.dir)} ${esc(c.tel)}</div></div><div class="r"><div style="font-size:13px">Comprobante de venta</div><b style="font-size:26px">${f.num}</b><div>${new Date(f.f).toLocaleString("es-CO")}</div></div></div><p><b>Cliente:</b> ${esc(f.cli)} ${esc(f.doc)}<br><b>Pago:</b> ${esc(f.pago)}</p><div class="sc"><table><tr><th>Producto</th><th class="r">Cant.</th><th class="r">Precio</th><th class="r">Subtotal</th></tr>${f.it.map(x=>`<tr><td>${esc(x[0])}</td><td class="r">${x[1]}</td><td class="r">${fm(x[2])}</td><td class="r">${fm(x[1]*x[2])}</td></tr>`).join("")}</table></div><div class="tot" style="flex-direction:column;align-items:flex-end;gap:2px;margin-top:12px"><span>Subtotal ${fm(f.sub)}</span>${c.iva?`<span>IVA ${c.iva}% ${fm(f.iva)}</span>`:""}<span>Total <b>${fm(f.total)}</b></span></div><p style="font-size:12px;color:#6b6590;margin-top:20px">${esc(c.nota)}</p></div>`}
function nueva(){const sub=L.reduce((a,x)=>a+x[1]*x[2],0),iva=sub*S.cfg.iva/100;return `<div class="c"><h2>Datos de la venta</h2><div class="g"><div><label>Cliente</label><input id="cn" placeholder="Cliente general"></div><div><label>Documento</label><input id="cd"></div><div><label>Medio de pago</label><select id="cp"><option>Efectivo</option><option>Transferencia</option><option>Tarjeta</option></select></div></div></div>
<div class="c"><h2>Productos</h2><div class="g"><div style="grid-column:span 2"><label>Producto</label><input id="pn" list="dl" oninput="pick()" placeholder="Busca o escribe uno"><datalist id="dl">${S.prods.map(x=>`<option value="${esc(x[0])}">`).join("")}</datalist></div><div><label>Cantidad</label><input id="pq" type="number" min="1" value="1"></div><div><label>Precio</label><input id="pp" type="number" min="0"></div></div><p><button class="btn g2" onclick="addL()">Agregar</button></p><div class="sc"><table>${L.map((x,i)=>`<tr><td>${esc(x[0])}</td><td class="r">${x[1]}</td><td class="r">${fm(x[2])}</td><td class="r">${fm(x[1]*x[2])}</td><td class="r"><button class="btn g2" onclick="L.splice(${i},1);draw()">Quitar</button></td></tr>`).join("")||"<tr><td>Aún no hay productos.</td></tr>"}</table></div><div class="tot"><span>Subtotal ${fm(sub)}</span>${S.cfg.iva?`<span>IVA ${fm(iva)}</span>`:""}<span>Total <b>${fm(sub+iva)}</b></span></div><p class="r"><button class="btn" onclick="emitir()">Emitir comprobante</button></p></div>`}
function hist(){const hoy=new Date().toDateString(),dia=S.facts.filter(f=>new Date(f.f).toDateString()==hoy).reduce((a,f)=>a+f.total,0);return `<div class="c"><h2>Historial</h2><p>Vendido hoy: <b>${fm(dia)}</b> · ${S.facts.length} comprobantes en total</p><div class="sc"><table><tr><th>N.º</th><th>Fecha</th><th>Cliente</th><th class="r">Total</th><th></th></tr>${S.facts.map(f=>`<tr><td>${f.num}</td><td>${new Date(f.f).toLocaleDateString("es-CO")}</td><td>${esc(f.cli)}</td><td class="r">${fm(f.total)}</td><td class="r"><button class="btn g2" onclick="view='${f.num}';draw()">Ver</button></td></tr>`).join("")||"<tr><td>Aún no hay comprobantes.</td></tr>"}</table></div><p><button class="btn g2" onclick="mk()">Preparar para Excel</button></p>${csv?`<label>Selecciona todo, copia y pega en Excel</label><textarea rows="6" onfocus="this.select()">${esc(csv)}</textarea>`:""}</div>`}
function mk(){csv="Numero\tFecha\tCliente\tDocumento\tPago\tSubtotal\tIVA\tTotal\n"+S.facts.map(f=>[f.num,new Date(f.f).toLocaleDateString("es-CO"),f.cli,f.doc,f.pago,f.sub,f.iva,f.total].join("\t")).join("\n");draw()}
function prod(){return `<div class="c"><h2>Productos</h2><div class="g"><div><label>Nombre</label><input id="an"></div><div><label>Precio</label><input id="ap" type="number" min="0"></div></div><p><button class="btn" onclick="S.prods.push([$('#an').value||'Sin nombre',+$('#ap').value||0]);save();draw()">Agregar al catálogo</button></p><table>${S.prods.map((x,i)=>`<tr><td>${esc(x[0])}</td><td class="r">${fm(x[1])}</td><td class="r"><button class="btn g2" onclick="S.prods.splice(${i},1);save();draw()">Quitar</button></td></tr>`).join("")}</table></div>`}
function cfg(){const c=S.cfg;return `<div class="c"><h2>Ajustes</h2><div class="g">${[["tienda","Nombre de la tienda"],["nit","NIT o documento"],["dir","Dirección"],["tel","Teléfono"],["pre","Prefijo de numeración"],["sig","Próximo número"],["iva","IVA (%), confírmalo con tu contador"]].map(x=>`<div><label>${x[1]}</label><input id="c_${x[0]}" value="${esc(c[x[0]])}"></div>`).join("")}</div><p><label>Texto al pie del comprobante</label><textarea id="c_nota" rows="2">${esc(c.nota)}</textarea></p><button class="btn" onclick="['tienda','nit','dir','tel','pre','nota'].forEach(k=>S.cfg[k]=$('#c_'+k).value);S.cfg.sig=+$('#c_sig').value||1;S.cfg.iva=+$('#c_iva').value||0;save();alert('Ajustes guardados');draw()">Guardar ajustes</button></div>`}
function draw(){const f=view&&S.facts.find(x=>x.num==view);$("#nav").innerHTML=TABS.map(t=>`<button class="${t[0]==tab?"on":""}" onclick="go('${t[0]}')">${t[1]}</button>`).join("");$("#m").innerHTML=f?doc(f):{nueva,hist,prod,cfg}[tab]()}
draw();
</script></body></html>
